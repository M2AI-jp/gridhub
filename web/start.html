<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GridHub — はじめの画面</title>
  <meta name="description" content="GridHub: フォルダを選んで、5mm方眼ノートの開発すごろくを遊ぶ。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23fdfaf0'/%3E%3Cpath d='M8 0V32M16 0V32M24 0V32M0 8H32M0 16H32M0 24H32' stroke='%239fd0e6' stroke-width='1'/%3E%3Crect x='9' y='9' width='14' height='14' fill='%23ffe45c' stroke='%231d2b5c' stroke-width='2'/%3E%3C/svg%3E">
  <!-- 外の字は、はじめの画面を描いたあとで読む（届かなくても待たない。§37） -->
  <link id="hand-fonts" disabled href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Yomogi&family=Yusei+Magic&display=swap" rel="stylesheet" media="print">
  <link rel="stylesheet" href="board/board.css">
  <link rel="stylesheet" href="board/hero.css">
</head>
<body class="start-page">
  <main id="start" class="start-sheet" aria-labelledby="start-title">
    <header class="start-head">
      <h1 id="start-title" class="logo" aria-label="GridHub"><span class="lg-cell">G</span><span class="lg-cell">r</span><span class="lg-cell">i</span><span class="lg-cell">d</span><span class="lg-hub">Hub</span></h1>
      <p class="start-tagline">テスト1件 = 1マス。通ったぶんだけ進む開発すごろく</p>
    </header>

    <section id="start-hero" class="start-hero" hidden aria-label="勇者の手帳"></section>

    <section class="start-actions" aria-label="はじめる">
      <div class="start-card">
        <button id="choose-folder" class="start-btn primary" type="button">フォルダを選ぶ</button>
        <p class="start-hint">冒険の書のあるフォルダなら盤面が、まだ無ければ入口（作りたいものの願いを書く）が開きます。新しいフォルダも、その場で作れます。</p>
        <form id="folder-form" class="folder-form" hidden>
          <label for="folder-path">フォルダの場所（/ から始まる絶対パス）</label>
          <div class="folder-row">
            <input id="folder-path" type="text" autocomplete="off" spellcheck="false" placeholder="/Users/あなた/memo">
            <button class="start-btn small" type="submit">開く</button>
          </div>
        </form>
      </div>
      <div class="start-card tutorial-card">
        <button id="tutorial" class="start-btn" type="button">チュートリアルで遊ぶ</button>
        <p class="start-hint">勇者と見習いAIの2役を、あなたが盤面のボタンだけで演じます。ターミナルもエディタも使わずに、5分であがれます。</p>
      </div>
      <p id="start-error" class="start-error" role="alert" hidden></p>
    </section>

    <section class="start-recent" aria-labelledby="recent-title">
      <h2 id="recent-title">最近のフォルダ</h2>
      <ul id="recent" class="recent-list"></ul>
      <p id="recent-empty" class="start-hint" hidden>まだありません。フォルダを選ぶか、チュートリアルで遊んでみてください。</p>
    </section>

    <footer id="env" class="start-env">
      <span id="env-node"></span>
      <span id="env-claude" data-found=""></span>
    </footer>
  </main>
  <script type="module" src="board/start.js"></script>
</body>
</html>
